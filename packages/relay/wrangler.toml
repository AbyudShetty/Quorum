# The hosted Quorum relay on Cloudflare Workers (free plan). Deploy: see worker/README.md.
# It lives here, next to package.json, because `npx wrangler` runs in the folder that holds
# package.json (npm workspaces), whichever subfolder you start it from.
name = "quorum-relay"
main = "worker/index.js"
compatibility_date = "2026-10-01"

# One Durable Object per home server (it stores nothing). The free plan offers only SQLite-backed
# Durable Objects.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# The phone book (D-20): one small Durable Object per Quorum ID, holding {home, salt}.
[[durable_objects.bindings]]
name = "PHONEBOOK"
class_name = "Phonebook"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Phonebook"]
